<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Fonts (come originale) -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+Pro:wght@300;400;600&display=swap"
    rel="stylesheet" />

  <!-- Import map per Three.js CDN (CRITICAL!) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
    }
  }
  </script>

  <!-- GSAP Animation Library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <title>HUB-EGI | Ecosystem Control</title>
  <!-- FlorenceEGI Analytics Tracker -->
  <script>window.FEAnalyticsConfig={siteId:'egi-hub-home',endpoint:'https://hub.florenceegi.com/api/analytics/collect'};</script>
  <script src="https://hub.florenceegi.com/build/tracker/analytics-tracker.js" defer></script>
</head>

<body>
  <!-- Engine 3D riabilitato per desktop -->
  <script type="module" src="/ecosystem_data.js?v=desktop_align_v1"></script>
  <script type="module" src="/engine.js?v=emergency_fix"></script>

  <!-- React UI overlay -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- SERVICE WORKER KILLER: Force unregister old SW to clear cache -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          console.log('🚨 Unregistering Service Worker:', registration);
          registration.unregister();
        }
        if (registrations.length > 0) {
          console.log('♻️ Service Workers killed. Reloading page...');
          window.location.reload();
        }
      });
    }
  </script>
</body>

</html>
